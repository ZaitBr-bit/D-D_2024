name: visual-baseline

# ============================================================
# Workflow read-only para capturar os oráculos de DOM baseline
# (tests/fixtures/dom-baseline/*.json) e os screenshots
# (tests/e2e/__screenshots__/**) na imagem Linux pinada usada pela suíte
# visual, publicando-os como artifact. Nunca commita nem faz push — quem
# baixa o artifact decide o que fazer com ele.
#
# Gatilhos:
# - push do PRÓPRIO arquivo deste workflow na branch `refatoracao` (o
#   primeiro push que o cria/atualiza no repositório);
# - push de qualquer tag `visual-baseline-*` — filtros de path do GitHub
#   Actions não se aplicam a push de tag, então esse gatilho permite retry
#   (criar um novo tag) sem exigir nenhuma mudança de arquivo;
# - workflow_dispatch, disponível assim que o arquivo já existir na branch
#   padrão do repositório (pré-requisito do próprio GitHub, não configurado
#   aqui).
#
# Pushes posteriores que só alterem site/ ou dados/ (sem tocar neste
# arquivo) NÃO disparam este workflow continuamente — o filtro `paths`
# do gatilho de branch garante isso.
# ============================================================

on:
  push:
    branches:
      - refatoracao
    paths:
      - '.github/workflows/visual-baseline.yml'
    tags:
      - 'visual-baseline-*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  capture-baseline:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Checkout (history completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node 22.17.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'

      - name: Instalar dependências
        run: npm ci

      - name: Guard — repositório no commit-baseline, site/dados intactos
        run: node scripts/assert-baseline-commit.mjs

      - name: Capturar oráculos de DOM baseline (creator-steps + sheet-sections)
        run: npm run test:e2e:update-dom

      - name: Capturar screenshots (baseline visual)
        run: npm run test:e2e:update-snapshots

      - name: Comparação normal — DOM baseline (sem update, mesma imagem Linux)
        run: npm run test:e2e:dom

      - name: Comparação normal — visual (sem update, mesma imagem Linux)
        run: npm run test:e2e:visual

      - name: Publicar oráculos e screenshots como artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-${{ github.sha }}
          path: |
            tests/fixtures/dom-baseline/*.json
            tests/e2e/__screenshots__/**
          if-no-files-found: error
          retention-days: 90
