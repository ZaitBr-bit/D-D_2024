name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Reaproveita o workflow de CI inteiro (checks, testes, Firestore Emulator,
  # funcional/visual/PWA) — o deploy só prossegue se TUDO passar. É por isso
  # que o job de publicação abaixo declara `needs: verify`.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"

      - name: Instalar dependências
        run: npm ci

      - name: check:syntax
        run: npm run check:syntax

      - name: check:architecture
        run: npm run check:architecture

      - name: check:validators
        run: npm run check:validators

      # Gera o artifact de deploy de forma DETERMINÍSTICA (Task 35): copia
      # site/ e dados/ byte-a-byte, injeta a versão via marcador único (sem
      # sed, sem Python inline) e escreve o manifesto de precache com SHA-256
      # real de cada asset.
      - name: build:pages
        run: npm run build:pages -- --out _dist --version "${{ github.sha }}-${{ github.run_number }}"

      # Recalcula o mesmo grafo de completude contra o artifact JÁ
      # construído e compara byte-a-byte — garante que o que será publicado é
      # exatamente o que o Service Worker vai instalar.
      - name: verify:pages
        run: npm run verify:pages -- --dir _dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
